<title>Audit ảnh Mifune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* Layout: sticky filter bar over a contact-sheet grid of scene cards; issue chips double as filters. */
  :root {
    --bg: #eef0f3; --panel: #ffffff; --fg: #1b1f27; --muted: #5d6573; --line: #d9dde4; --accent: #2747a8;
    --i-placeholder: #b42318; --i-screenshot: #b54708; --i-text: #6941c6; --i-poster: #475467;
    --i-watermark: #93370d; --i-unrelated: #c01048; --done: #12704a; --chip: #e4e8f0; --vi: #0f6b5c; --on-accent: #ffffff;
    --body: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: #1b2029; --fg: #e7eaf0; --muted: #9aa3b2; --line: #2c3340; --accent: #8fa8ff;
      --i-placeholder: #f97066; --i-screenshot: #fdb022; --i-text: #b692f6; --i-poster: #98a2b3;
      --i-watermark: #f79009; --i-unrelated: #f670c7; --done: #47cd89; --chip: #252c38; --vi: #7fd1bf; --on-accent: #10131c; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --panel: #1b2029; --fg: #e7eaf0; --muted: #9aa3b2; --line: #2c3340; --accent: #8fa8ff;
    --i-placeholder: #f97066; --i-screenshot: #fdb022; --i-text: #b692f6; --i-poster: #98a2b3;
    --i-watermark: #f79009; --i-unrelated: #f670c7; --done: #47cd89; --chip: #252c38; --vi: #7fd1bf; --on-accent: #10131c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.55 var(--body); padding-inline: 16px; padding-block: 0 48px; }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg);
           padding-block: 14px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
          border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
  .chip b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .chip:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type=search] { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
                       border-radius: 6px; padding: 6px 9px; width: min(320px, 100%); }
  label.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
  button.copy { font: inherit; font-size: 13px; border: 1px solid var(--accent); color: var(--accent); background: transparent;
                border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  #count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  #copied { color: var(--done); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
          display: flex; flex-direction: column; min-width: 0; border-top: 3px solid var(--c, var(--line)); }
  .card.done { opacity: .55; }
  .shot { aspect-ratio: 4 / 3; background: var(--chip); display: flex; align-items: center; justify-content: center; max-width: 100%; }
  .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .shot span { color: var(--muted); font-size: 12px; }
  .body { padding: 9px 11px 11px; display: grid; gap: 6px; min-width: 0; }
  .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .num { font-family: var(--mono); font-weight: 500; font-size: 15px; }
  .time { font-family: var(--mono); color: var(--muted); font-size: 12px; }
  .tag { font-size: 11.5px; font-weight: 500; color: var(--c); border: 1px solid var(--c); border-radius: 4px; padding: 0 6px; }
  .tag.reused { --c: var(--muted); }
  .note { color: var(--c); font-size: 12.5px; }
  .text { font-size: 13px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .meta a { color: var(--accent); }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .empty { color: var(--muted); padding: 32px 0; }
  .scenes { font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .scenes a { color: var(--accent); font-family: var(--mono); font-weight: 500; text-decoration: none; }
  .scenes a:hover { text-decoration: underline; }
  .vi { color: var(--vi); font-size: 13px; }
  .card .c-man { min-width: 0; }
  form.card-form { display: flex; gap: 6px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: -1px; }
  .tab { font: inherit; font-weight: 500; background: transparent; color: var(--muted); border: 0;
         border-bottom: 2px solid transparent; padding: 6px 12px 8px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .tab b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 4px; }
  select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 8px; max-width: 100%; }
  .tlwrap { margin-top: 14px; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  table.tl { width: 100%; border-collapse: collapse; min-width: 1080px; }
  .tl th, .tl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
  .tl th { font-size: 12px; font-weight: 600; color: var(--muted); position: sticky; top: 0; background: var(--panel); }
  .tl tr:last-child td { border-bottom: 0; }
  .tl tr[data-issue] td:first-child { box-shadow: inset 3px 0 0 var(--c); }
  .c-idx { width: 96px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .c-idx b { font-family: var(--mono); font-weight: 500; font-size: 15px; }
  .c-idx div { color: var(--muted); font-size: 12px; }
  .c-text, .c-vi { min-width: 190px; max-width: 320px; font-size: 13.5px; }
  .c-vi { color: var(--vi); }
  .c-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .c-vi .c-sub { color: var(--vi); opacity: .85; }
  .c-kw { width: 190px; }
  .c-kw span { display: block; width: fit-content; max-width: 100%; background: var(--chip); border-radius: 4px;
               padding: 2px 8px; margin: 0 0 6px; font-size: 12px; overflow-wrap: anywhere; }
  .c-kw span.hit { box-shadow: inset 0 0 0 1px var(--done); color: var(--done); }
  .c-kw span.unsearched { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
  .kwlegend { color: var(--muted); font-size: 12px; }
  .kwlegend b { color: var(--done); font-weight: 500; }
  .c-img { width: 200px; }
  .c-img img, .c-img .ph { display: block; width: 180px; height: 112px; object-fit: cover; border-radius: 6px; background: var(--chip); }
  .c-img .ph { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
  .c-img .meta { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .c-man { min-width: 300px; }
  .c-man form { display: flex; gap: 6px; }
  .c-man input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
                 border-radius: 6px; padding: 6px 8px; }
  .c-man button { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
                  border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  .c-man button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .c-man button:disabled { opacity: .55; cursor: default; }
  .saved { margin-top: 8px; border: 1px dashed var(--line); border-radius: 6px; padding: 8px; font-size: 12px; color: var(--muted);
           overflow-wrap: anywhere; display: grid; gap: 4px; }
  .saved a { color: var(--accent); }
  .saved .st { font-weight: 500; }
  .saved .st.wait { color: var(--i-screenshot); } .saved .st.ok { color: var(--done); }
  .msg { font-size: 12px; margin-top: 6px; } .msg.err { color: var(--i-placeholder); } .msg.ok { color: var(--done); }
  .dbnote { font-size: 12.5px; color: var(--muted); }
  @media (max-width: 760px) {
    .tlwrap { border: 0; background: transparent; overflow: visible; }
    table.tl, .tl thead, .tl tbody, .tl tr, .tl td { display: block; width: 100%; min-width: 0; max-width: none; }
    .tl thead { display: none; }
    .tl tr { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; padding: 6px 0; }
    .tl td { border: 0; padding: 6px 12px; }
    .c-img img, .c-img .ph { width: 100%; height: auto; aspect-ratio: 16 / 10; }
  }
  [data-issue="placeholder"] { --c: var(--i-placeholder); } [data-issue="screenshot"] { --c: var(--i-screenshot); }
  [data-issue="text"] { --c: var(--i-text); } [data-issue="poster"] { --c: var(--i-poster); }
  [data-issue="watermark"] { --c: var(--i-watermark); } [data-issue="unrelated"] { --c: var(--i-unrelated); }
</style>

<header>
  <div class="top">
    <h1>Audit ảnh · __TITLE__</h1>
    <span class="sub" id="summary"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-audit" data-tab="audit" type="button">Audit ảnh <b id="n-audit"></b></button>
    <button class="tab" role="tab" id="tab-timeline" data-tab="timeline" type="button">Timeline từng cảnh <b id="n-tl"></b></button>
  </nav>
  <div id="bar-audit">
  <div class="chips" id="chips"></div>
  <div class="tools" style="margin-top:10px">
    <input type="search" id="q" placeholder="Tìm số cảnh, lời thoại, nhóm, ghi chú">
    <label class="toggle"><input type="checkbox" id="hideDone"> Ẩn cảnh đã đánh dấu xem</label>
    <button class="copy" id="copy" type="button">Chép số cảnh đang hiện</button>
    <span id="copied" aria-live="polite"></span>
    <span id="count"></span>
  </div>
  </div>
  <div class="tools" id="bar-timeline" hidden>
    <input type="search" id="tq" placeholder="Tìm số cảnh, lời thoại, bản dịch, từ khóa">
    <select id="tf" aria-label="Lọc cảnh">
      <option value="all">Tất cả cảnh</option>
      <option value="flagged">Cần xem (audit)</option>
      <option value="reused">Ảnh dùng lại</option>
      <option value="linked">Đã dán link thủ công</option>
    </select>
    <select id="tg" aria-label="Nhảy tới nhóm"></select>
    <span id="tcount" class="sub"></span>
    <span class="kwlegend">Từ khóa: <b>✓</b> tìm ra ảnh này · viền đứt là chưa tìm</span>
    <span id="dbnote" class="dbnote"></span>
  </div>
</header>
<main class="grid" id="grid"></main>
<main id="timeline" hidden>
  <div class="tlwrap"><table class="tl">
    <thead><tr><th>Cảnh / Cue</th><th>Lời thoại</th><th>Bản dịch tiếng Việt</th><th>Từ khóa</th><th>Ảnh preview</th><th>Ảnh thủ công (dán link)</th></tr></thead>
    <tbody id="tlrows"></tbody>
  </table></div>
</main>

<script>
const SCENES = __DATA__;
const VI = __VI__;
const IMGS = __IMGS__;
for (const s of SCENES) s.img = s.img ? IMGS[s.img] : "";
const ISSUES = [
  ["placeholder", "Ảnh giữ chỗ, ảnh lỗi"],
  ["screenshot", "Chụp màn hình, thumbnail video"],
  ["text", "Ảnh chữ, đồ họa"],
  ["unrelated", "Không liên quan"],
  ["watermark", "Có watermark"],
  ["poster", "Poster, bìa DVD, sách"],
];
const LABEL = Object.fromEntries(ISSUES);
const $ = s => document.querySelector(s);
let filter = "flagged";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("audit-done-img") || "[]")); } catch (e) {}
function saveDone() { try { localStorage.setItem("audit-done-img", JSON.stringify([...done])); } catch (e) {} }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function fmt(t) { return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`; }

// One card per distinct image: every scene that shows it, flagged if any of them is.
const CARDS = (() => {
  const by = new Map();
  for (const s of SCENES) {
    const key = s.file || "scene-" + s.n;
    if (!by.has(key)) by.set(key, { key, img: s.img, scenes: [], issue: null, note: null });
    const c = by.get(key);
    c.scenes.push(s);
    if (s.issue && !c.issue) { c.issue = s.issue; c.note = s.note; }
  }
  return [...by.values()];
})();
const flaggedCards = () => CARDS.filter(c => c.issue);

function chips() {
  const f = flaggedCards();
  const opts = [["flagged", "Cần xem", f.length], ...ISSUES.map(([k, l]) => [k, l, CARDS.filter(c => c.issue === k).length]),
                ["all", "Tất cả ảnh", CARDS.length]];
  $("#chips").innerHTML = opts.map(([k, l, n]) =>
    `<button class="chip" type="button" data-f="${k}" ${ISSUES.some(i => i[0] === k) ? `data-issue="${k}"` : ""}
       aria-pressed="${k === filter}"><span class="dot"></span>${esc(l)} <b>${n}</b></button>`).join("");
  const sc = f.reduce((n, c) => n + c.scenes.length, 0);
  $("#summary").textContent = `${SCENES.length} cảnh · ${CARDS.length} ảnh khác nhau · ${f.length} ảnh cần xem (${sc} cảnh) · Claude Code xem contact sheet ngày 12/10/2026`;
}

function visible(c) {
  if (filter === "flagged" && !c.issue) return false;
  if (filter !== "flagged" && filter !== "all" && c.issue !== filter) return false;
  if ($("#hideDone").checked && done.has(c.key)) return false;
  const q = $("#q").value.trim().toLowerCase();
  if (!q) return true;
  if (/^\d+$/.test(q)) return c.scenes.some(s => String(s.n) === q);
  return [c.note, LABEL[c.issue], ...c.scenes.flatMap(s => [s.text, s.subject, s.kw, VI[s.text]])].join(" ").toLowerCase().includes(q);
}

function cardLink(c) {
  const ns = c.scenes.map(s => s.n), have = ns.filter(n => links[n]);
  const urls = [...new Set(have.map(n => links[n].url))];
  const applied = have.length && have.every(n => SCENES[n - 1].manual_url === links[n].url);
  const can = !!db;
  let saved = "";
  if (have.length) {
    const st = applied && have.length === ns.length ? `<span class="st ok">Đã áp dụng vào video</span>`
      : `<span class="st wait">${have.length === ns.length ? "Đã lưu cho cả " + ns.length + " cảnh" : "Đã lưu cho " + have.length + "/" + ns.length + " cảnh"}, chờ Claude áp dụng</span>`;
    saved = `<div class="saved">${st}${urls.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div>`;
  }
  return `<form class="c-man card-form" data-key="${esc(c.key)}"><input type="url" id="clink-${esc(c.key)}" placeholder="https://… link ảnh thay thế"
      value="${esc(urls.length === 1 ? urls[0] : "")}" ${can ? "" : "disabled"} aria-label="Link ảnh thay thế">
      <button type="submit" ${can ? "" : "disabled"}>Lưu</button>${have.length && can ? `<button type="button" class="ghost" data-cclear="${esc(c.key)}">Xóa</button>` : ""}</form>
    ${saved}<div class="msg" id="cmsg-${esc(c.key)}"></div>`;
}

function card(c) {
  const s0 = c.scenes[0];
  let host = "";
  try { host = s0.url ? new URL(s0.url).hostname.replace(/^www\./, "") : ""; } catch (e) {}
  const list = c.scenes.map(s => `<a href="#timeline" data-goto="${s.n}">#${s.n}</a> <span class="time">${fmt(s.t)}</span>`).join(" · ");
  return `<article class="card ${done.has(c.key) ? "done" : ""}" ${c.issue ? `data-issue="${c.issue}"` : ""}>
    <div class="shot">${c.img ? `<img loading="lazy" src="${c.img}" alt="Ảnh của cảnh ${c.scenes.map(s => s.n).join(", ")}">` : `<span>Không có ảnh</span>`}</div>
    <div class="body">
      <div class="head">${c.issue ? `<span class="tag">${esc(LABEL[c.issue])}</span>` : ""}
        <span class="sub">${c.scenes.length > 1 ? "Dùng ở " + c.scenes.length + " cảnh" : "1 cảnh"}</span></div>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}
      <div class="scenes">${list}</div>
      <div class="text">${esc(s0.text)}</div>
      ${VI[s0.text] ? `<div class="vi">${esc(VI[s0.text])}</div>` : ""}
      ${s0.query ? `<div class="meta">Tìm bằng: <span class="q">${esc(s0.query)}</span></div>` : ""}
      <div class="meta">Nhóm ${esc(s0.g)}: ${esc(s0.subject)} · ${esc(s0.src)}${host ? ` · <a href="${esc(s0.url)}" target="_blank" rel="noopener">${esc(host)}</a>` : ""}</div>
      ${cardLink(c)}
      <div class="foot"><label class="toggle"><input type="checkbox" data-done="${esc(c.key)}" ${done.has(c.key) ? "checked" : ""}> Đã xem</label></div>
    </div>
  </article>`;
}

function render() {
  const list = CARDS.filter(visible);
  $("#grid").innerHTML = list.length ? list.map(card).join("") : `<p class="empty">Không có ảnh nào khớp bộ lọc.</p>`;
  $("#count").textContent = `${list.length} ảnh đang hiện`;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.f === filter));
}

$("#chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) { filter = c.dataset.f; render(); } });
$("#q").addEventListener("input", render);
$("#hideDone").addEventListener("change", render);
$("#grid").addEventListener("change", e => {
  const k = e.target.dataset.done; if (!k) return;
  e.target.checked ? done.add(k) : done.delete(k); saveDone();
  e.target.closest(".card").classList.toggle("done", e.target.checked);
});
$("#grid").addEventListener("submit", e => {
  e.preventDefault();
  const c = CARDS.find(x => x.key === e.target.dataset.key); if (!c || !db) return;
  saveLinks(c.scenes.map(s => s.n), e.target.querySelector("input").value.trim(), document.getElementById("cmsg-" + c.key));
});
$("#grid").addEventListener("click", e => {
  const g = e.target.closest("[data-goto]");
  if (g) { e.preventDefault(); showTab("timeline"); $("#tq").value = g.dataset.goto; $("#tf").value = "all"; renderTimeline(); return; }
  const b = e.target.closest("[data-cclear]");
  if (b && db) { const c = CARDS.find(x => x.key === b.dataset.cclear); if (c) saveLinks(c.scenes.map(s => s.n), "", document.getElementById("cmsg-" + c.key)); }
});
$("#copy").addEventListener("click", async () => {
  const nums = CARDS.filter(visible).flatMap(c => c.scenes.map(s => s.n)).sort((a, b) => a - b).join(", ");
  try { await navigator.clipboard.writeText(nums); $("#copied").textContent = "Đã chép"; }
  catch (e) { $("#copied").textContent = nums; }
  setTimeout(() => { if ($("#copied").textContent === "Đã chép") $("#copied").textContent = ""; }, 2000);
});

let links = {};      // scene -> {url, at} from the shared store
let db = null;
function linkCell(s) {
  const l = links[s.n], applied = s.manual_url && l && l.url === s.manual_url;
  const can = !!db;
  const saved = l ? `<div class="saved"><span class="st ${applied ? "ok" : "wait"}">${applied ? "Đã áp dụng vào video" : "Đã lưu, chờ Claude áp dụng"}</span>
      <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a></div>` : "";
  return `<form data-n="${s.n}"><input type="url" id="link-${s.n}" placeholder="https://… link ảnh" value="${esc(l ? l.url : "")}" ${can ? "" : "disabled"}>
      <button type="submit" ${can ? "" : "disabled"}>Lưu</button>${l && can ? `<button type="button" class="ghost" data-clear="${s.n}">Xóa</button>` : ""}</form>
    ${saved}<div class="msg" id="msg-${s.n}"></div>`;
}
function kwChips(s) {
  const done = s.searched.split("|").map(k => k.trim()).filter(Boolean);
  return s.kw.split("|").map(k => k.trim()).filter(Boolean).map(k => {
    const hit = k === s.query, searched = !done.length || done.includes(k);
    const cls = hit ? "hit" : searched ? "" : "unsearched";
    const tip = hit ? "Ảnh của cảnh này tìm được từ keyword này" : searched ? "Đã tìm" : "Chưa tìm (nhóm đã đủ ảnh)";
    return `<span class="${cls}" title="${tip}">${hit ? "✓ " : ""}${esc(k)}</span>`;
  }).join("");
}
function tlRow(s) {
  const vt = VI[s.text], vg = [VI[s.subject], VI[s.ctx]].filter(Boolean).map(esc).join(" · ");
  const badges = (s.issue ? `<span class="tag">${esc(LABEL[s.issue])}</span>` : "") + (s.reused ? `<span class="tag reused">dùng lại</span>` : "")
    + (s.manual_url ? `<span class="tag reused">thủ công</span>` : "");
  return `<tr id="s-${s.n}" ${s.issue ? `data-issue="${s.issue}"` : ""}>
    <td class="c-idx"><b>#${s.n}</b><div>cue ${esc(s.cues)}</div><div>${fmt(s.t)} → ${fmt(s.e)}</div></td>
    <td class="c-text">${esc(s.text)}<div class="c-sub">Nhóm ${esc(s.g)}: ${esc(s.subject)}</div></td>
    <td class="c-vi">${vt ? esc(vt) : `<span class="sub">Chưa có bản dịch</span>`}${vg ? `<div class="c-sub">Nhóm ${esc(s.g)}: ${vg}</div>` : ""}</td>
    <td class="c-kw">${kwChips(s)}</td>
    <td class="c-img">${s.img ? `<img loading="lazy" src="${s.img}" alt="Ảnh cảnh ${s.n}">` : `<div class="ph">Không có ảnh</div>`}
      <div class="meta">${badges}<span class="sub">${esc(s.src)}</span>${s.url ? `<a class="sub" href="${esc(s.url)}" target="_blank" rel="noopener">nguồn</a>` : ""}</div>
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}</td>
    <td class="c-man">${linkCell(s)}</td></tr>`;
}
function tlVisible(s) {
  const f = $("#tf").value, q = $("#tq").value.trim().toLowerCase();
  if (f === "flagged" && !s.issue) return false;
  if (f === "reused" && !s.reused) return false;
  if (f === "linked" && !links[s.n]) return false;
  if (!q) return true;
  if (/^\d+$/.test(q)) return String(s.n) === q;
  return [s.text, s.subject, s.ctx, s.kw, s.note, VI[s.text], VI[s.subject], VI[s.ctx]].join(" ").toLowerCase().includes(q);
}
function renderTimeline() {
  const list = SCENES.filter(tlVisible);
  $("#tlrows").innerHTML = list.length ? list.map(tlRow).join("") : `<tr><td colspan="6" class="empty">Không có cảnh nào khớp.</td></tr>`;
  const n = Object.keys(links).length;
  $("#tcount").textContent = `${list.length} cảnh đang hiện · ${n} link đã dán`;
}
function groups() {
  const seen = new Map();
  for (const s of SCENES) if (!seen.has(s.g)) seen.set(s.g, s);
  $("#tg").innerHTML = `<option value="">Nhảy tới nhóm…</option>` +
    [...seen.values()].map(s => `<option value="${s.n}">${esc(s.g)}. ${esc(s.subject)} (${fmt(s.t)})</option>`).join("");
}
async function saveLinks(nums, url, msg) {
  try {
    if (url && !/^https?:\/\//i.test(url)) throw new Error("Link phải bắt đầu bằng http:// hoặc https://");
    for (const n of nums) {
      const ref = db.collection("manual").doc(String(n));
      if (url) await ref.set({ scene: n, url, at: new Date().toISOString() }); else await ref.delete();
    }
    if (msg) { msg.className = "msg ok"; msg.textContent = url ? `Đã lưu link cho ${nums.length} cảnh` : "Đã xóa link"; }
  } catch (e) {
    if (msg) { msg.className = "msg err"; msg.textContent = "Không lưu được: " + (e.message || e.code || e); }
  }
}
$("#tlrows").addEventListener("submit", e => {
  e.preventDefault();
  const n = Number(e.target.dataset.n); if (!n || !db) return;
  saveLinks([n], $("#link-" + n).value.trim(), $("#msg-" + n));
});
$("#tlrows").addEventListener("click", e => {
  const b = e.target.closest("[data-clear]"); if (b && db) saveLinks([Number(b.dataset.clear)], "", $("#msg-" + b.dataset.clear));
});
(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { $("#dbnote").textContent = "Chỉ xem: trang này không lưu được link trong chế độ xem hiện tại."; return; }
  render();
  db.collection("manual").onSnapshot(snap => {
    links = {};
    for (const d of snap.docs) { const v = d.data(); if (v && v.url) links[Number(d.id)] = v; }
    const active = (document.activeElement && document.activeElement.id) || "";
    if (active.startsWith("link-") || active.startsWith("clink-")) return;  // keep what is being typed
    if (!$("#timeline").hidden) renderTimeline(); else { $("#tlrows").innerHTML = ""; render(); }
  }, err => { $("#dbnote").textContent = "Mất kết nối kho link: " + err.code; });
  if (!$("#timeline").hidden) renderTimeline();
})();
function showTab(name) {
  const tl = name === "timeline";
  $("#tab-audit").setAttribute("aria-selected", !tl); $("#tab-timeline").setAttribute("aria-selected", tl);
  $("#bar-audit").hidden = tl; $("#grid").hidden = tl; $("#bar-timeline").hidden = !tl; $("#timeline").hidden = !tl;
  if (tl && !$("#tlrows").innerHTML) renderTimeline();
  if (!tl) render();
  try { history.replaceState(null, "", "#" + name); } catch (e) {}
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) showTab(b.dataset.tab); });
$("#tq").addEventListener("input", renderTimeline);
$("#tf").addEventListener("change", renderTimeline);
$("#tg").addEventListener("change", e => {
  if (!e.target.value) return;
  $("#tq").value = ""; $("#tf").value = "all"; renderTimeline();
  const el = document.getElementById("s-" + e.target.value);
  if (el) el.scrollIntoView({ block: "start" });
  e.target.value = "";
});
$("#n-audit").textContent = flaggedCards().length;
$("#n-tl").textContent = SCENES.length;
chips(); render(); groups();
showTab(location.hash === "#timeline" ? "timeline" : "audit");
</script>
