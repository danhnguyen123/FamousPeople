[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docugen"
version = "0.1.0"
description = "SRT + audio to documentary video: Claude plans the images, Remotion renders"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.9",
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "pillow>=10",
  "python-dotenv>=1.0",
]

[project.scripts]
docugen = "docugen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docugen"]
