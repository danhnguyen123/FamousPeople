[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docugen"
version = "0.1.0"
description = "Script to documentary video pipeline: celebrity footage agent + Remotion timeline"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.9",
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "pysbd>=0.3.4",
  "pillow>=10",
  "imagehash>=4.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# CLIP semantic reranking. Large download (torch); install only where you render.
clip = ["open_clip_torch>=2.24", "torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
docugen = "docugen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docugen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
