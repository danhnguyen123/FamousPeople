<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt ảnh</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2f5bd3; --accent-text: #ffffff; --ok: #1f7a4d; --err: #b3261e; --chip: #eef1f8;
    --warn-bg: #fff4e0; --warn: #8a5300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe7; --muted: #a2a19b; --line: #33332f;
      --accent: #7d9cf5; --accent-text: #10131c; --ok: #6fcf97; --err: #f28b82; --chip: #262b38;
      --warn-bg: #3a2c12; --warn: #f2c27b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .stats { color: var(--muted); }
  .tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tools input[type=search] { width: 220px; }
  input[type=search], input[type=url] {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; min-width: 0;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 8px; }
  button { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
           border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  button:disabled { opacity: .6; cursor: wait; }
  main { padding: 0 16px 48px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); margin-top: 12px;
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel); }
  tr:last-child td { border-bottom: 0; }
  .idx { width: 92px; white-space: nowrap; }
  .idx b { font-size: 15px; }
  .idx div { color: var(--muted); font-size: 12px; }
  .text { min-width: 200px; max-width: 360px; }
  .subject { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .kw { width: 200px; }
  .kw span { display: inline-block; background: var(--chip); border-radius: 4px; padding: 1px 6px;
             margin: 0 4px 4px 0; font-size: 12px; }
  .thumb { width: 200px; }
  .thumb img, .man img { display: block; width: 180px; height: 112px; object-fit: cover; border-radius: 6px;
                         background: var(--chip); }
  .thumb .meta { color: var(--muted); font-size: 12px; margin-top: 4px; word-break: break-all; }
  .empty { width: 180px; height: 112px; border-radius: 6px; border: 1px dashed var(--line); color: var(--muted);
           display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-right: 4px; }
  .badge.manual { background: var(--accent); color: var(--accent-text); }
  .badge.reused { background: var(--warn-bg); color: var(--warn); }
  .man { min-width: 380px; }
  .man .row { display: flex; gap: 6px; }
  .man .row input { flex: 1; }
  .man .pair { display: flex; gap: 10px; margin-top: 8px; align-items: flex-start; }
  .msg { font-size: 12px; margin-top: 6px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .banner { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); }
  @media (max-width: 900px) {
    table, thead, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
    td { border: 0; padding: 6px 12px; max-width: none; min-width: 0; }
    .man { min-width: 0; }
    .tools { margin-left: 0; }
    .tools input[type=search] { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Duyệt ảnh</h1>
  <span class="stats" id="stats"></span>
  <div class="tools">
    <input type="search" id="q" placeholder="Tìm trong lời thoại, từ khóa">
    <select id="filter">
      <option value="all">Tất cả cảnh</option>
      <option value="manual">Đã thay thủ công</option>
      <option value="missing">Thiếu ảnh</option>
      <option value="reused">Ảnh dùng lại</option>
    </select>
  </div>
</header>
<main>
  <div class="banner" id="banner" hidden></div>
  <table>
    <thead>
      <tr><th>Cảnh / Cue</th><th>Lời thoại</th><th>Từ khóa</th><th>Ảnh preview</th><th>Ảnh thủ công (dán link)</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
let scenes = [];

function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function fileUrl(path) { return path ? `/files/${encodeURI(path)}?v=${Date.now()}` : null; }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function previewCell(s) {
  if (!s.image) return `<div class="empty">Không có ảnh<br>(giữ ảnh cảnh trước)</div>`;
  const badges = (s.note === "manual" ? `<span class="badge manual">thủ công</span>` : "")
               + (s.reused ? `<span class="badge reused">dùng lại</span>` : "");
  const url = fileUrl(s.image);
  return `<a href="${url}" target="_blank" rel="noopener"><img loading="lazy" src="${url}" alt=""></a>
          <div class="meta">${badges}${esc(s.source || "")}</div>`;
}

function manualCell(s) {
  const img = s.manual_url
    ? `<a href="${esc(s.manual_url)}" target="_blank" rel="noopener"><img loading="lazy" src="${fileUrl(s.image)}" alt=""></a>`
    : `<div class="empty">Chưa có ảnh thủ công</div>`;
  return `<div class="row">
            <input type="url" placeholder="https://… link ảnh" value="${esc(s.manual_url || "")}">
            <button data-act="save">Lưu</button>
            ${s.manual_url ? `<button class="ghost" data-act="clear">Xóa</button>` : ""}
          </div>
          <div class="pair">${img}</div>
          <div class="msg"></div>`;
}

function rowHtml(s) {
  return `<td class="idx"><b>#${s.scene}</b><div>cue ${esc(s.cues)}</div><div>${fmtTime(s.start)}</div></td>
          <td class="text">${esc(s.text)}<div class="subject">Nhóm ${esc(s.group)}: ${esc(s.subject)}</div></td>
          <td class="kw">${s.keywords.map(k => `<span>${esc(k)}</span>`).join("")}</td>
          <td class="thumb">${previewCell(s)}</td>
          <td class="man">${manualCell(s)}</td>`;
}

function visible(s) {
  const q = $("#q").value.trim().toLowerCase();
  const f = $("#filter").value;
  if (f === "manual" && !s.manual_url) return false;
  if (f === "missing" && s.image) return false;
  if (f === "reused" && !s.reused) return false;
  if (!q) return true;
  return (s.text + " " + s.keywords.join(" ") + " " + s.subject).toLowerCase().includes(q);
}

function render() {
  const tbody = $("#rows");
  tbody.innerHTML = "";
  for (const s of scenes) {
    if (!visible(s)) continue;
    const tr = document.createElement("tr");
    tr.dataset.scene = s.scene;
    tr.innerHTML = rowHtml(s);
    tbody.appendChild(tr);
  }
  updateStats();
}

function updateStats() {
  const manual = scenes.filter(s => s.manual_url).length;
  const missing = scenes.filter(s => !s.image).length;
  $("#stats").textContent = `${scenes.length} cảnh · ${manual} thay thủ công · ${missing} thiếu ảnh`;
}

async function submit(tr, url) {
  const scene = Number(tr.dataset.scene);
  const msg = $(".msg", tr);
  tr.querySelectorAll("button").forEach(b => b.disabled = true);
  msg.className = "msg";
  msg.textContent = url ? "Đang tải ảnh…" : "Đang xóa…";
  try {
    const r = await fetch("/api/manual", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scene, url }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    const i = scenes.findIndex(s => s.scene === scene);
    if (url) {
      scenes[i] = data.scene;
      tr.innerHTML = rowHtml(data.scene);
    } else {
      await load();  // the pool image comes back
    }
    $("#banner").hidden = false;
    $("#banner").textContent = "Đã cập nhật ảnh. Chạy lại `docugen run <slug>` để dựng lại timeline và render với ảnh mới.";
    const m = $(".msg", document.querySelector(`tr[data-scene="${scene}"]`));
    if (m) { m.className = "msg ok"; m.textContent = url ? "Đã lưu ảnh thủ công" : "Đã xóa, dùng lại ảnh của plan"; }
    updateStats();
  } catch (e) {
    msg.className = "msg err";
    msg.textContent = "Lỗi: " + e.message;
    tr.querySelectorAll("button").forEach(b => b.disabled = false);
  }
}

$("#rows").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const tr = btn.closest("tr");
  submit(tr, btn.dataset.act === "save" ? $("input", tr).value.trim() : "");
});
$("#rows").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("input[type=url]")) {
    submit(e.target.closest("tr"), e.target.value.trim());
  }
});
$("#q").addEventListener("input", render);
$("#filter").addEventListener("change", render);

async function load() {
  const r = await fetch("/api/scenes");
  const data = await r.json();
  if (!r.ok) {
    $("#banner").hidden = false;
    $("#banner").textContent = data.error || "Không đọc được plan.csv";
    return;
  }
  $("#title").textContent = `Duyệt ảnh · ${data.title}`;
  document.title = `Duyệt ảnh · ${data.slug}`;
  scenes = data.scenes;
  render();
}
load();
</script>
</body>
</html>
